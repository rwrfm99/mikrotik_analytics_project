name: mikrotik-analytics

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  env_file: .env
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: traffic
      CLICKHOUSE_USER: traffic_ingest
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?Set CLICKHOUSE_READER_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/traffic.xml:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8123/ping]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ipfix-collector:
    build: ./collector
    env_file: .env
    ports:
      - '${IPFIX_BIND:-0.0.0.0}:${IPFIX_PORT:-2055}:2055/udp'
    volumes:
      - ipfix_spool:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8091}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/up]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    <<: *backend

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      API_PROXY_TARGET: http://nginx
      WATCH_POLLING: 'true'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mikrotik_analytics}
      POSTGRES_USER: ${DB_USERNAME:-mikrotik}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  queue-worker:
    <<: *backend
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60

  scheduler:
    <<: *backend
    command: php artisan schedule:work

  hotspot-collector:
    <<: *backend
    image: mikrotik-analytics-backend
    command: php artisan mikrotik:collect
    restart: unless-stopped
    init: true

volumes:
  clickhouse_data:
  ipfix_spool:
  postgres_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
